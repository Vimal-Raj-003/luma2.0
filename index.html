<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c0a0d" />
    <meta name="description" content="LUMA — Layers of Happiness. A rich, refreshing Falooda layered with flavour, texture and joy." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/hero_frames/ezgif-frame-001.jpg" fetchpriority="high" />
    <style>
      html,body{background:#1c0a0d}
      #poster{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100lvh;z-index:0;pointer-events:none;overflow:hidden;background:#0e0508;transition:opacity .35s ease}
      #poster img{position:absolute;max-width:none;display:block}
      #poster.is-hidden{opacity:0}
    </style>
    <title>LUMA — Layers of Happiness</title>
  </head>
  <body>
    <!-- Frame 1 shown instantly (before any JS), cover-fit like the hero canvas. Framing mirrors coverPlacement() in FrameBackground.jsx -->
    <div id="poster" aria-hidden="true"><img id="poster-img" src="/hero_frames/ezgif-frame-001.jpg" alt="" fetchpriority="high" decoding="async" draggable="false" /></div>
    <script>
      (function () {
        var W = innerWidth, H = innerHeight, sh = H <= 520, pt = W <= 900 && !sh;
        var sc = Math.max(W / 1920, H / 1080) * (pt && W <= 500 ? 0.95 : 1), dw = 1920 * sc, dh = 1080 * sc;
        var tx = pt ? 0.5 : sh ? 0.68 : 0.64;
        var l = dw >= W ? Math.min(Math.max(tx * W - 1190 * sc, W - dw), 0) : (W - dw) / 2;
        var t = dh >= H ? Math.min(Math.max(H * 0.5 - 610 * sc, H - dh), 0) : (H - dh) / 2;
        var i = document.getElementById('poster-img').style;
        i.left = l + 'px'; i.top = t + 'px'; i.width = dw + 'px'; i.height = dh + 'px';
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
